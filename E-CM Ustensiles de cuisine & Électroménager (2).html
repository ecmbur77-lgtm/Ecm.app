<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>E-CM | Ustensiles de cuisine & Électroménager - Issa Camara</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ecm: {
              green: '#034B22',
              'green-dark': '#023317',
              'green-light': '#08582B',
              'green-soft': '#E6F4EC',
              orange: '#FF5722',
              'orange-hover': '#F24E1E',
              bg: '#F5F7F6',
              card: '#FFFFFF',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Custom UI Polish */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .screen-fade {
      animation: fadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px) scale(0.99); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .glass-morphism {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
  </style>
</head>
<body class="h-full font-sans antialiased bg-slate-950 text-slate-800 flex justify-center items-center sm:py-4">

  <!-- Mobile Frame Container -->
  <div id="app" class="w-full max-w-md h-full sm:h-[852px] bg-ecm-bg sm:rounded-[44px] shadow-2xl flex flex-col overflow-hidden relative border-0 sm:border-[10px] sm:border-slate-800">
    
    <!-- Top Mobile Status Bar -->
    <header class="bg-ecm-green text-white px-6 pt-3 pb-2 flex justify-between items-center text-xs font-semibold z-50 shrink-0">
      <span id="current-time" class="font-bold tracking-tight">09:41</span>
      <!-- Dynamic Owner Pill -->
      <div class="flex items-center space-x-1.5 bg-black/20 px-2 py-0.5 rounded-full text-[10px] font-medium border border-white/10">
        <i data-lucide="shield-check" class="w-3 h-3 text-emerald-400"></i>
        <span>Créateur : Issa Camara</span>
      </div>
      <div class="flex items-center space-x-1.5">
        <i data-lucide="wifi" class="w-3.5 h-3.5"></i>
        <i data-lucide="battery" class="w-4 h-4"></i>
      </div>
    </header>

    <!-- MAIN DYNAMIC CONTENT SCROLL AREA -->
    <main id="main-content" class="flex-1 overflow-y-auto relative no-scrollbar pb-20">
      <!-- Screens injected by JS Router -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav id="bottom-nav" class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200/80 px-2 py-2 flex justify-around items-center z-40 rounded-b-none sm:rounded-b-[34px] shadow-2xl">
      <button onclick="navigateTo('home')" id="nav-home" class="nav-btn flex flex-col items-center py-1 px-3 rounded-xl text-ecm-green font-bold transition">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-[10px] mt-0.5">Accueil</span>
      </button>
      <button onclick="navigateTo('catalog')" id="nav-catalog" class="nav-btn flex flex-col items-center py-1 px-3 rounded-xl text-slate-400 font-medium hover:text-ecm-green transition">
        <i data-lucide="layout-grid" class="w-5 h-5"></i>
        <span class="text-[10px] mt-0.5">Catalogue</span>
      </button>
      <button onclick="navigateTo('cart')" id="nav-cart" class="nav-btn flex flex-col items-center py-1 px-3 rounded-xl text-slate-400 font-medium hover:text-ecm-green transition relative">
        <div class="relative">
          <i data-lucide="shopping-bag" class="w-5 h-5"></i>
          <span id="cart-badge" class="absolute -top-1.5 -right-2.5 bg-ecm-orange text-white text-[10px] font-black rounded-full w-4 h-4 flex items-center justify-center hidden border-2 border-white">0</span>
        </div>
        <span class="text-[10px] mt-0.5">Panier</span>
      </button>
      <button onclick="navigateTo('account')" id="nav-account" class="nav-btn flex flex-col items-center py-1 px-3 rounded-xl text-slate-400 font-medium hover:text-ecm-green transition">
        <i data-lucide="user" class="w-5 h-5"></i>
        <span class="text-[10px] mt-0.5">Compte</span>
      </button>
    </nav>

    <!-- Global Toast Notification -->
    <div id="toast" class="absolute top-14 left-1/2 -translate-x-1/2 bg-slate-900/95 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-xl z-50 flex items-center space-x-2 transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-4 border border-slate-700">
      <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400 shrink-0"></i>
      <span id="toast-message">Notification</span>
    </div>

    <!-- ADMIN PIN LOCK MODAL FOR MODIFICATION RESTRICTION -->
    <div id="admin-lock-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
      <div class="bg-white w-full max-w-xs rounded-3xl p-6 shadow-2xl text-center space-y-4 border border-slate-100 screen-fade relative">
        <button onclick="closeAdminLockModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
        
        <div class="w-14 h-14 bg-ecm-green/10 text-ecm-green rounded-2xl flex items-center justify-center mx-auto border border-ecm-green/20">
          <i data-lucide="lock" class="w-7 h-7"></i>
        </div>

        <div>
          <h3 class="text-base font-extrabold text-slate-900">Accès Administrateur</h3>
          <p class="text-[11px] text-slate-500 mt-1 leading-relaxed">
            Seul <span class="font-bold text-ecm-green">Issa Camara</span> est autorisé à modifier le catalogue, les prix et les photos de l'application.
          </p>
        </div>

        <form onsubmit="verifyAdminPin(event)" class="space-y-3 pt-2">
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Entrez le Code PIN d'accès</label>
            <input id="admin-pin-input" type="password" maxlength="6" placeholder="• • • •" class="w-full text-center tracking-widest text-lg font-bold p-3 bg-slate-100 border border-slate-200 rounded-xl focus:outline-none focus:border-ecm-green">
            <p id="pin-error" class="text-[10px] text-red-500 font-bold mt-1 hidden">Code PIN incorrect ! Seul Issa Camara possède l'accès.</p>
          </div>

          <button type="submit" class="w-full bg-ecm-green hover:bg-ecm-green-light text-white py-3 rounded-xl font-bold text-xs shadow-md transition">
            Déverrouiller la gestion
          </button>
        </form>

        <p class="text-[9px] text-slate-400 italic">Code PIN par défaut : <span class="font-mono font-bold text-slate-600">1234</span></p>
      </div>
    </div>

  </div>

      },
      {
        id: 'prod-5',
        name: 'Micro-ondes 20L Numérique',
        category: 'Electromenager',
        price: 54900,
        oldPrice: 62000,
        badge: 'En stock',
        image: 'https://images.unsplash.com/photo-1585659722983-3a675dabf23d?w=600&auto=format&fit=crop&q=80',
        rating: 4.6,
        reviewsCount: 82,
        description: 'Micro-ondes moderne avec programmes automatiques de décongélation et réchauffage rapide.',
        specs: ['Capacité 20L', '700W de puissance', '8 programmes', 'Écran digital']
      },
      {
        id: 'prod-6',
        name: 'Set de couteaux de cuisine 6 pcs',
        category: 'Ustensiles',
        price: 19900,
        oldPrice: 24000,
        badge: 'Top Qualité',
        image: 'https://images.unsplash.com/photo-1593618998160-e34014e67546?w=600&auto=format&fit=crop&q=80',
        rating: 4.8,
        reviewsCount: 115,
        description: 'Bloc de couteaux professionnels affûtés avec précision pour toutes vos découpes en cuisine.',
        specs: ['Acier inox haute précision', 'Bloc support bois incliné', 'Ciseaux inclus', 'Aiguiseur de précision']
      }
    ];

    // Local Storage Hydration
    let products = JSON.parse(localStorage.getItem('ecm_products')) || DEFAULT_PRODUCTS;
    let cart = JSON.parse(localStorage.getItem('ecm_cart')) || [];
    let favorites = JSON.parse(localStorage.getItem('ecm_favorites')) || ['prod-1', 'prod-3'];
    let orders = JSON.parse(localStorage.getItem('ecm_orders')) || [
      {
        id: 'E-CM20250926',
        date: '26 sept. 2025 - 14:32',
        status: 'En préparation',
        items: [
          { name: 'Friteuse sans huile 8L', price: 69900, qty: 1, image: 'https://images.unsplash.com/photo-1626143509930-b18429ef994e?w=300&auto=format&fit=crop&q=80' },
          { name: 'Blender professionnel 2L', price: 39900, qty: 1, image: 'https://images.unsplash.com/photo-1570222094114-d054a817e56b?w=300&auto=format&fit=crop&q=80' }
        ],
        subtotal: 109800,
        shipping: 2000,
        total: 111800,
        address: 'Ouagadougou, Burkina Faso',
        paymentMethod: 'Orange Money'
      }
    ];

    let isAdminUnlocked = false; // Admin status requirement
    let activeTab = 'home';
    let selectedCategory = 'Tous';
    let searchQuery = '';
    let activeProductDetail = null;
    let activeOrderId = 'E-CM20250926';

    function saveData() {
      localStorage.setItem('ecm_products', JSON.stringify(products));
      localStorage.setItem('ecm_cart', JSON.stringify(cart));
      localStorage.setItem('ecm_favorites', JSON.stringify(favorites));
      localStorage.setItem('ecm_orders', JSON.stringify(orders));
      updateCartBadge();
    }

    function formatPrice(amount) {
      return new Intl.NumberFormat('fr-FR').format(amount) + ' F CFA';
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-message').textContent = msg;
      toast.classList.remove('opacity-0', '-translate-y-4', 'pointer-events-none');
      toast.classList.add('opacity-100', 'translate-y-0');
      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-4', 'pointer-events-none');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2600);
    }

    function updateCartBadge() {
      const badge = document.getElementById('cart-badge');
      const count = cart.reduce((acc, item) => acc + item.qty, 0);
      if (count > 0) {
        badge.textContent = count;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }
    }

    // ADMIN SECURITY ACCESS LOCK
    function openAdminLockModal() {
      if (isAdminUnlocked) {
        navigateTo('admin');
      } else {
        document.getElementById('admin-lock-modal').classList.remove('hidden');
        document.getElementById('admin-pin-input').value = '';
        document.getElementById('pin-error').classList.add('hidden');
      }
    }

    function closeAdminLockModal() {
      document.getElementById('admin-lock-modal').classList.add('hidden');
    }

    function verifyAdminPin(e) {
      e.preventDefault();
      const pin = document.getElementById('admin-pin-input').value;
      if (pin === '1234' || pin.toLowerCase() === 'issa') {
        isAdminUnlocked = true;
        closeAdminLockModal();
        showToast('Session Administrateur active : Issa Camara');
        navigateTo('admin');
      } else {
        document.getElementById('pin-error').classList.remove('hidden');
      }
    }

    function navigateTo(tab, extraData = null) {
      activeTab = tab;
      const main = document.getElementById('main-content');
      const bottomNav = document.getElementById('bottom-nav');
      
      // Update nav tab highlights
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('text-ecm-green', 'font-bold');
        btn.classList.add('text-slate-400', 'font-medium');
      });

      const currentNavBtn = document.getElementById(`nav-${tab}`);
      if (currentNavBtn) {
        currentNavBtn.classList.remove('text-slate-400', 'font-medium');
        currentNavBtn.classList.add('text-ecm-green', 'font-bold');
      }

      // Hide bottom nav on specific screens
      if (['splash', 'onboarding', 'checkout-step1', 'checkout-step2', 'order-success'].includes(tab)) {
        bottomNav.classList.add('hidden');
      } else {
        bottomNav.classList.remove('hidden');
      }

      // Render tab view
      switch (tab) {
        case 'splash': renderSplashScreen(); break;
        case 'onboarding': renderOnboardingScreen(); break;
        case 'home': renderHomeScreen(); break;
        case 'catalog': renderCatalogScreen(); break;
        case 'product-detail':
          if (extraData) activeProductDetail = extraData;
          renderProductDetailScreen(activeProductDetail);
          break;
        case 'cart': renderCartScreen(); break;
        case 'checkout-step1': renderCheckoutStep1(); break;
        case 'checkout-step2': renderCheckoutStep2(); break;
        case 'order-success': renderOrderSuccessScreen(extraData); break;
        case 'order-tracking':
          if (extraData) activeOrderId = extraData;
          renderOrderTrackingScreen(activeOrderId);
          break;
        case 'account': renderAccountScreen(); break;
        case 'favorites': renderFavoritesScreen(); break;
        case 'notifications': renderNotificationsScreen(); break;
        case 'contact': renderContactScreen(); break;
        case 'admin': renderAdminScreen(); break;
        default: renderHomeScreen();
      }

      lucide.createIcons();
      main.scrollTop = 0;
    }

    function renderSplashScreen() {
      const main = document.getElementById('main-content');
      main.innerHTML = `
        <div class="h-full bg-gradient-to-b from-ecm-green-dark via-ecm-green to-ecm-green text-white p-6 flex flex-col justify-between items-center text-center screen-fade">
          <div class="pt-10">
            <div class="w-20 h-20 bg-ecm-orange rounded-3xl flex items-center justify-center mx-auto shadow-2xl mb-4 border-2 border-white/20">

            </div>
            <h1 class="text-3xl font-black tracking-tight">E-CM</h1>
            <p class="text-[11px] text-emerald-200 uppercase tracking-widest font-extrabold mt-1">Ustensiles de cuisine & Électroménager</p>
            <span class="inline-block mt-3 bg-white/10 backdrop-blur-md px-3 py-1 rounded-full text-[10px] text-emerald-100 font-semibold border border-white/15">
              Édité par Issa Camara
            </span>
          </div>

          <div class="my-auto space-y-4">
            <h2 class="text-xl font-extrabold leading-snug px-4">Tout pour votre cuisine et votre maison au Burkina Faso</h2>
            <div class="grid grid-cols-2 gap-3 max-w-xs mx-auto pt-2">
              <img src="https://images.unsplash.com/photo-1626143509930-b18429ef994e?w=300&auto=format&fit=crop&q=80" class="rounded-2xl shadow-lg h-28 w-full object-cover border border-white/20" />
              <img src="https://images.unsplash.com/photo-1584992236310-6edddc08acff?w=300&auto=format&fit=crop&q=80" class="rounded-2xl shadow-lg h-28 w-full object-cover border border-white/20" />
            </div>
          </div>

          <div class="w-full pb-4">
            <button onclick="navigateTo('onboarding')" class="w-full bg-ecm-orange hover:bg-ecm-orange-hover text-white py-4 rounded-2xl font-bold shadow-xl transition flex items-center justify-center space-x-2">
              <span>Découvrir l'application</span>
              <i data-lucide="arrow-right" class="w-5 h-5"></i>
            </button>
          </div>
        </div>
      `;
    }

    function renderOnboardingScreen() {
      const main = document.getElementById('main-content');
      main.innerHTML = `
        <div class="h-full bg-white text-slate-800 p-6 flex flex-col justify-between items-center text-center screen-fade">
          <div class="pt-4 w-full flex justify-between items-center">
            <div class="flex items-center space-x-2">
              <div class="w-8 h-8 bg-ecm-orange rounded-xl flex items-center justify-center shadow-md">

              <div class="absolute -bottom-3 -right-2 bg-white px-3 py-2 rounded-xl shadow-lg border border-slate-100 flex items-center space-x-2">
                <i data-lucide="award" class="w-4 h-4 text-emerald-600"></i>
                <span class="text-[11px] font-bold text-slate-800">100% Qualité Certifiée</span>
              </div>
            </div>
            
            <div class="pt-4 space-y-2">
              <h2 class="text-2xl font-black text-slate-900">Bienvenue sur E-CM</h2>
              <p class="text-xs text-slate-500 leading-relaxed px-4">
                La référence des ustensiles et de l'électroménager de qualité à Ouagadougou. Fondé et géré par <span class="font-bold text-ecm-green">Issa Camara</span>.
              </p>
            </div>

            <!-- Carousel dots -->
            <div class="flex justify-center space-x-1.5 pt-2">
              <span class="w-2 h-2 rounded-full bg-slate-200"></span>
              <span class="w-6 h-2 rounded-full bg-ecm-orange"></span>
              <span class="w-2 h-2 rounded-full bg-slate-200"></span>

          </div>

          <div class="w-full space-y-2.5 pb-2">
            <button onclick="navigateTo('home')" class="w-full bg-ecm-orange hover:bg-ecm-orange-hover text-white py-3.5 rounded-2xl font-bold text-xs shadow-lg transition">
              Commencer

            <button onclick="navigateTo('account')" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-2xl font-semibold text-xs transition">

    }

    function renderHomeScreen() {
      const main = document.getElementById('main-content');
      
      const filtered = products.filter(p => {
        const matchesCat = selectedCategory === 'Tous' || p.category === selectedCategory;
        const matchesSearch = p.name.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      main.innerHTML = `
        <div class="p-4 space-y-4 screen-fade">
          
          <!-- Header Bar -->
          <div class="flex items-center justify-between pt-1">
            <div class="flex items-center space-x-2.5">
              <div class="w-10 h-10 bg-ecm-orange rounded-2xl flex items-center justify-center shadow-lg shadow-orange-500/20">

              </div>
              <div>
                <h1 class="font-black text-ecm-green text-xl leading-none tracking-tight">E-CM</h1>
                <p class="text-[10px] text-slate-500 font-semibold mt-0.5">Ustensiles & Électroménager</p>
              </div>
            </div>

            <button onclick="openAdminLockModal()" class="bg-slate-100 hover:bg-emerald-50 text-slate-700 hover:text-ecm-green p-2 rounded-xl text-xs font-bold flex items-center space-x-1.5 border border-slate-200 transition">
              <i data-lucide="shield-lock" class="w-4 h-4 text-ecm-green"></i>
              <span class="text-[11px]">Espace Admin</span>
            </button>
          </div>

          <!-- Strict Creator Banner -->
          <div class="bg-white border border-slate-200/80 rounded-xl p-2.5 flex items-center justify-between text-[11px] shadow-sm">

      const item = cart.find(i => i.id === id);

        if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
        saveData();
        renderCartScreen();
      }
    }

    function removeCartItem(id) {
      cart = cart.filter(i => i.id !== id);
      saveData();
      renderCartScreen();
    }

    function addToCart(productId) {
      const p = products.find(item => item.id === productId);
      if (!p) return;
      const existing = cart.find(item => item.id === productId);
      if (existing) {
        existing.qty += 1;
      } else {
        cart.push({ id: p.id, name: p.name, price: p.price, image: p.image, qty: 1 });
      }
      saveData();
      showToast('Ajouté au panier !');
    }

        showToast('Ajouté aux favoris !');

      if (activeTab === 'favorites') renderFavoritesScreen();
      else if (activeTab === 'home') renderHomeScreen();
      else if (activeTab === 'catalog') renderCatalogScreen();

              <p class="text-base font-black text-ecm-green mt-0.5">${products.length}</p>
            </div>
            <div class="bg-white p-2.5 rounded-xl border border-slate-100 shadow-sm text-center">
              <p class="text-[9px] text-slate-400 font-bold uppercase">Ventes</p>
              <p class="text-base font-black text-ecm-orange mt-0.5">${orders.length}</p>
            </div>
            <div class="bg-white p-2.5 rounded-xl border border-slate-100 shadow-sm text-center">
              <p class="text-[9px] text-slate-400 font-bold uppercase">Chiffre d'aff.</p>
              <p class="text-[10px] font-black text-slate-800 mt-1 truncate">${formatPrice(totalRevenue)}</p>
            </div>
          </div>

          <!-- Product Management Form -->
          <div class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
              <h3 class="text-xs font-extrabold text-slate-800">
                ${editingProductId ? 'Modifier un article (Issa Camara)' : 'Ajouter un article au catalogue'}
              </h3>
              ${editingProductId ? `
                <button onclick="resetAdminForm()" class="text-[10px] text-red-500 font-bold">Annuler</button>
              ` : ''}
            </div>

            <form onsubmit="handleProductSubmit(event)" class="space-y-2.5 text-xs">
              <div>
                <label class="block text-[10px] text-slate-500 font-bold mb-1">Nom du produit *</label>
                <input id="admin-name" type="text" required placeholder="ex: Friteuse sans huile 8L" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-medium focus:outline-none focus:border-ecm-green">
              </div>

              <div class="grid grid-cols-2 gap-2">
                <div>
                  <label class="block text-[10px] text-slate-500 font-bold mb-1">Prix (F CFA) *</label>
                  <input id="admin-price" type="number" required placeholder="69900" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-medium focus:outline-none focus:border-ecm-green">
                </div>
                <div>
                  <label class="block text-[10px] text-slate-500 font-bold mb-1">Ancien Prix (FCFA)</label>
                  <input id="admin-old-price" type="number" placeholder="79900" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-medium focus:outline-none focus:border-ecm-green">
                </div>
              </div>

              <div>
                <label class="block text-[10px] text-slate-500 font-bold mb-1">Catégorie *</label>
                <select id="admin-category" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-medium focus:outline-none focus:border-ecm-green">
                  <option value="Ustensiles">Ustensiles de cuisine</option>
                  <option value="Electromenager">Électroménager</option>
                  <option value="Petits appareils">Petits appareils</option>
                </select>
              </div>

              <div>
                <label class="block text-[10px] text-slate-500 font-bold mb-1">Lien de la photo (URL) *</label>
                <input id="admin-image" type="url" required placeholder="https://images.unsplash.com/..." class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-medium focus:outline-none focus:border-ecm-green">
              </div>

              <div>
                <label class="block text-[10px] text-slate-500 font-bold mb-1">Description du produit</label>
                <textarea id="admin-description" rows="2" placeholder="Saisir la description..." class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-medium focus:outline-none focus:border-ecm-green"></textarea>
              </div>

              <button type="submit" class="w-full bg-ecm-orange hover:bg-ecm-orange-hover text-white py-3 rounded-xl font-bold text-xs shadow-md transition">
                ${editingProductId ? 'Mettre à jour l\'article' : 'Publier le produit'}
              </button>
            </form>
          </div>

          <!-- Product CRUD List -->
          <div class="space-y-2">
            <h3 class="text-xs font-extrabold text-slate-800">Gestion des articles (${products.length})</h3>

            <div class="space-y-2">
              ${products.map(p => `
                <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex items-center justify-between space-x-3">
                  <img src="${p.image}" onerror="this.src='https://placehold.co/100x100/034B22/FFFFFF?text=E-CM'" class="w-12 h-12 object-cover rounded-xl border border-slate-100 shrink-0" />

                  <div class="flex-1 min-w-0">
                    <h4 class="text-xs font-bold text-slate-800 truncate">${p.name}</h4>
                    <p class="text-xs font-black text-ecm-green">${formatPrice(p.price)}</p>
                    <span class="text-[9px] text-slate-400 font-medium">${p.category}</span>
                  </div>

                  <div class="flex items-center space-x-1 shrink-0">
                    <button onclick="editProduct('${p.id}')" class="p-2 text-slate-600 hover:text-ecm-green bg-slate-50 rounded-lg">
                      <i data-lucide="edit-3" class="w-4 h-4"></i>
                    </button>
                    <button onclick="deleteProduct('${p.id}')" class="p-2 text-slate-600 hover:text-red-500 bg-slate-50 rounded-lg">
                      <i data-lucide="trash-2" class="w-4 h-4"></i>
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

        </div>
      `;
    }

    function handleProductSubmit(e) {
      e.preventDefault();
      
      const name = document.getElementById('admin-name').value;
      const price = parseFloat(document.getElementById('admin-price').value);
      const oldPrice = parseFloat(document.getElementById('admin-old-price').value) || null;
      const category = document.getElementById('admin-category').value;
      const image = document.getElementById('admin-image').value;
      const description = document.getElementById('admin-description').value || 'Produit certifié E-CM par Issa Camara.';

      if (editingProductId) {
        const index = products.findIndex(p => p.id === editingProductId);
        if (index !== -1) {
          products[index] = { ...products[index], name, price, oldPrice, category, image, description };
          showToast('Produit mis à jour par Issa Camara');
        }
        editingProductId = null;
      } else {
        const newProd = {
          id: 'prod-' + Date.now(),
          name,
          price,
          oldPrice,
          category,
          image,
          badge: 'Nouveau',
          rating: 5.0,
          reviewsCount: 1,
          description,
          specs: ['Garantie Qualité Issa Camara', 'Produit Authentique E-CM']
        };
        products.unshift(newProd);
        showToast('Article ajouté au catalogue E-CM !');
      }

      saveData();
      renderAdminScreen();
      lucide.createIcons();
    }

    function editProduct(id) {
      const p = products.find(prod => prod.id === id);
      if (!p) return;

      editingProductId = id;
      renderAdminScreen();

      document.getElementById('admin-name').value = p.name;
      document.getElementById('admin-price').value = p.price;
      document.getElementById('admin-old-price').value = p.oldPrice || '';
      document.getElementById('admin-category').value = p.category;
      document.getElementById('admin-image').value = p.image;
      document.getElementById('admin-description').value = p.description || '';
      
      lucide.createIcons();
    }

    function resetAdminForm() {
      editingProductId = null;
      renderAdminScreen();
      lucide.createIcons();
    }

    function deleteProduct(id) {
      if (confirm('Êtes-vous sûr de vouloir supprimer cet article du catalogue E-CM ?')) {
        products = products.filter(p => p.id !== id);
        saveData();
        showToast('Article supprimé du catalogue');
        renderAdminScreen();
        lucide.createIcons();
      }
    }

    window.onload = function() {
      setInterval(() => {
        const timeEl = document.getElementById('current-time');
        if (timeEl) {
          const now = new Date();
          timeEl.textContent = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        }
      }, 1000);

      updateCartBadge();
      navigateTo('home');
    };
  </script>
</body>
</html>
